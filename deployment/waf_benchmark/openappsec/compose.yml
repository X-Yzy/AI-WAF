services:
  openappsec:
    image: ghcr.io/openappsec/agent-unified@sha256:59056f0e17f888bdc9ffc091d44b43f4e0af7d6094185e75fff4184e627da07d
    container_name: wad-openappsec-benchmark
    restart: "no"
    ipc: host
    ports:
      - "127.0.0.1:${WAD_OPENAPPSEC_PORT:-18083}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      user_email: benchmark@example.invalid
      autoPolicyLoad: "true"
    volumes:
      - ./local_policy.yaml:/ext/appsec/local_policy.yaml:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WAD_OPENAPPSEC_STATE_DIR:-../../../runtime/waf_products/openappsec}/config:/etc/cp/conf
      - ${WAD_OPENAPPSEC_STATE_DIR:-../../../runtime/waf_products/openappsec}/data:/etc/cp/data
      - ${WAD_OPENAPPSEC_STATE_DIR:-../../../runtime/waf_products/openappsec}/logs:/var/log/nano_agent
    command: /cp-nano-agent

