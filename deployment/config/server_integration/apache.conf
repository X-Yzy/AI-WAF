# 需要启用：proxy proxy_http headers
# 链路：Apache -> WAD :8081 -> 原业务端口
ProxyPreserveHost On
ProxyPass        /_wad/health http://127.0.0.1:8081/_wad/health
ProxyPassReverse /_wad/health http://127.0.0.1:8081/_wad/health
ProxyPass        / http://127.0.0.1:8081/ connectiontimeout=5 timeout=60
ProxyPassReverse / http://127.0.0.1:8081/

RequestHeader set X-Forwarded-Proto "https" env=HTTPS
